<div [ngClass]="responsiveService.isDesktop ? 'gfc-modal-page': ''">
  <div class="gfc-modal-header">
    <div class="d-flex align-items-center justify-content-between ms-3 me-3 py-2">
      <h5 class="mb-0">{{ formTitle }}</h5>
      <button class="btn btn-link d-none d-md-block" (click)="modalController.dismiss()">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>
  </div>

  <div class="inner-content">
    <div class="container-fluid">
      <div class="px-2 px-sm-3 py-3">

        <div class="mb-3">
          <label class="form-label">Titulo</label>
          <input class="form-control" autocapitalize="sentences" [(ngModel)]="image.title">
        </div>

        <div class="mb-3">
          <label class="form-label">Sección</label>
          <select class="form-select" (change)="sectionSelect" [(ngModel)]="section_id">
            @for (s of secciones; track s) {
              <option [value]="s.id">{{ s.name }}</option>
            }
          </select>
          @if (texto_sec != null) {
            <span class="badge bg-danger d-inline-flex align-items-center gap-1 mt-2">
              <i class="bi bi-exclamation-triangle"></i>
              <label class="form-label">{{texto_sec}}</label>
            </span>
          }
        </div>

        <div class="mb-3">
          <label class="form-label">Fotografía</label>
          <div class="te-file-select">
            <input type="file" accept=".jpeg,.jpg" id="gfc-image-file-input" class="te-file-input"
              (change)="handleFileInput($event.target['files'])" />
            <label for="gfc-image-file-input" class="te-file-button">
              <i class="bi bi-folder2-open"></i>
              <span>Examinar</span>
            </label>
            <span class="te-file-name">{{ file ? file.name : 'Ningún archivo seleccionado' }}</span>
          </div>
          @if (texto_img != null) {
            <span class="badge bg-danger d-inline-flex align-items-center gap-1 mt-2">
              <i class="bi bi-exclamation-triangle"></i>
              <label class="form-label">{{texto_img}}</label>
            </span>
          }
        </div>

        @if (img_url != '' || imageData != '') {
          <div class="mb-3 text-center">
            <img (ionError)="img_url=''" [src]="imgSource" alt="" class="te-preview img-fluid">
          </div>
        }

        <div class="d-flex justify-content-center gap-2 pt-3 flex-wrap">
          <button class="btn btn-outline-secondary" (click)="modalController.dismiss()">
            Cancelar
          </button>
          <button class="btn btn-success" [disabled]="!datosCargados()" (click)="postImage()">
            @if (posting) {
              <div class="spinner-border spinner-border-sm text-primary" role="status"><span class="visually-hidden">Loading...</span></div>
            }
            @if (!posting) {
              <span>Guardar</span>
            }
          </button>
        </div>

      </div>
    </div>
  </div>
</div>
