<div class="container-fluid px-0 py-3" style="height:100%">
  @if ((auth.user | async); as userLogged) {
    <app-table-editor
      #tableEditor
      id="usuarios"
      [columns]="tableColumns"
      [config]="getTableConfig()"
      [api]="getTableApi()"
      (rowSelected)="onRowSelected($event)"
    />
  }
</div>
